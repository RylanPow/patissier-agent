[project]
name = "patissier"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rylan Pow", email = "powrylan@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "asyncpg>=0.29.0",
    "fastapi>=0.110.0",
    "fastembed>=0.2.7",
    "fastmcp>=0.1.0",
    "httpx>=0.27.0",
    "langchain-core>=0.2.0",
    "langchain-mcp-adapters>=0.1.0",
    "langchain-openai>=0.1.0",
    "langgraph>=0.2.0",
    "mcp>=1.0.0",
    "pgvector>=0.2.5",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.28",
    "uvicorn[standard]>=0.28.0",
]

[project.scripts]
patissier = "patissier:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
